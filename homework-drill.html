<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自宅学習・穴埋めドリル</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0f172a;color:#f1f5f9}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:20px}a{color:#93c5fd}button,select{font:inherit;background:#334155;color:inherit;border:1px solid #64748b;border-radius:10px;padding:12px;min-height:46px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #93c5fd}section{background:#1e293b;border:1px solid #475569;border-radius:16px;padding:20px;margin:16px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:bold;margin-bottom:12px}label.choice:not(.good):not(.bad):has(input:checked){background:#1e40af;border-color:#93c5fd}label.choice{cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #64748b;border-radius:10px;margin:8px 0}input{width:20px;height:20px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary{background:#1d4ed8}.muted{color:#b5c4d8}button[disabled]{opacity:.5}h1{font-size:1.5rem}progress{width:100%}li{margin:12px 0}[hidden]{display:none!important}#quiz{padding-bottom:108px}#quiz .controls{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#1e293b;border-top:1px solid #64748b;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center}.controls button{padding:8px;font-size:14px;min-height:44px}.controls label{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:14px}#feedback{margin:8px 0;line-height:1.5}#explanation{margin:8px 0;overflow-wrap:anywhere}.choice.good{border-color:#86efac;background:#14532d}.choice.bad{border-color:#fca5a5;background:#7f1d1d}label.choice{padding:10px;margin:6px 0;overflow-wrap:anywhere}main:has(#quiz:not([hidden]))>h1,main:has(#quiz:not([hidden]))>p,main:has(#quiz:not([hidden]))>a{display:none} @media(max-width:480px){main{padding:6px}section{padding:12px;margin:4px 0}legend{margin-bottom:6px}}body{margin:0}fieldset,legend,.choice{min-width:0;max-width:100%;overflow-wrap:anywhere}legend{line-height:1.55}.choice input{flex:0 0 20px;accent-color:#93c5fd;margin:0}.choice span.choice-text{flex:1;min-width:0;white-space:pre-wrap}.choice:focus-within{outline:2px solid #93c5fd;outline-offset:2px}#choices label.choice{min-height:48px;flex-wrap:wrap;column-gap:10px;row-gap:4px}#choices label.choice.good{background:#14532d;border:2px solid #86efac;color:#f0fdf4}#choices label.choice.bad{background:#7f1d1d;border:2px solid #fca5a5;color:#fef2f2}#choices label.choice.good input{accent-color:#86efac}#choices label.choice.bad input{accent-color:#fca5a5}.choice .verdict{flex-basis:100%;padding-left:30px;font-size:.82rem;font-weight:700}.good .verdict{color:#bbf7d0}.bad .verdict{color:#fecaca}#choices.graded .choice{cursor:default}#feedback:not(:empty){padding:10px 12px;border:1px solid;border-radius:10px;font-weight:700;overflow-wrap:anywhere}#feedback.good{background:#14532d;border-color:#86efac;color:#dcfce7}#feedback.bad{background:#7f1d1d;border-color:#fca5a5;color:#fee2e2}#feedback:empty{margin:0}#explanation:not([hidden]){background:#0f172a;border:1px solid #64748b;border-radius:10px;padding:12px;line-height:1.65}.correct-answer{color:#bbf7d0;font-weight:700}.wrong-answer{color:#fecaca;font-weight:700}#explanation p{margin:0 0 8px}#explanation a,#result a{display:block;margin-top:8px}#quiz{padding-bottom:calc(126px + env(safe-area-inset-bottom,0px))}#quiz .controls{max-width:850px;margin:auto;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr)}.controls button{min-width:0;overflow-wrap:anywhere}.controls label{min-height:32px}.controls label input{flex:0 0 20px}#position{font-weight:700}progress{accent-color:#60a5fa;height:10px;margin:6px 0 12px}.code-question{white-space:pre-wrap;font-family:ui-monospace,monospace}#result button{margin:4px 4px 4px 0}#result li{overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}@media(max-width:480px){#setup select,#setup .primary{width:100%}#setup select{margin-top:6px}#quiz .controls{padding-left:8px;padding-right:8px}}
</style><main><a href="./index.html">← アプリのトップへ</a>　<a href="./textbook.html">教科書へ</a><h1>自宅学習・穴埋めドリル</h1><p>第1〜4回の穴埋め宿題を4択・正誤問題で復習します。</p><section id="setup"><h2>学習モード</h2><label for="scope">出題範囲</label> <select id="scope"><option value="0">第1〜4回すべて</option><option value="1">第1回</option><option value="2">第2回</option><option value="3">第3回</option><option value="4">第4回</option></select><p class="muted" id="total"></p><div class="row"><button id="practice" class="primary">穴埋めドリルを開始</button></div><p class="muted">選択肢をタップすると採点します。自動送りは学習中にオン・オフを切り替えられます。</p></section><section id="quiz" hidden><div id="position" role="status"></div><progress id="progress" aria-label="回答済み問題数"></progress><form id="answer"><fieldset><legend id="question"></legend><div id="choices"></div></fieldset><button class="primary" id="submit">回答する</button></form><div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><div id="explanation" role="region" aria-label="解説" hidden></div><div class="controls"><label><input id="auto" type="checkbox" checked> 自動で次へ（正解5秒・不正解8秒）</label><button id="explain" aria-controls="explanation" aria-expanded="false" disabled>解説</button><button id="next" class="primary" disabled>次の問題 →</button><button id="leave">中止</button></div></section><section id="result" hidden aria-live="polite"></section></main><script src="./materials/homework-drill.js"></script><script>
const $=id=>document.getElementById(id),bank=Array.isArray(window.HOMEWORK_DRILL)?window.HOMEWORK_DRILL:[];let list=[],pos=0,answers=[],mode='practice',timer=null;function cancelTimer(){clearTimeout(timer);timer=null}const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const source=q=>q.lesson>=3?'./materials/homework-0'+q.lesson+'.pdf#page='+q.page:'./textbook.html';
function updateTotal(){const scope=Number($('scope').value),count=bank.filter(q=>!scope||q.lesson===scope).length;$('total').textContent=count?'出題 '+count+'問（全'+bank.length+'問収録）':'問題データを読み込めません。ページを再読み込みしてください。';$('practice').disabled=!count}$('scope').onchange=updateTotal;updateTotal();function start(m,retry=null){cancelTimer();mode=m;const scope=Number($('scope').value);list=retry?shuffle(retry):m==='exam'?shuffle([1,2,3,4].flatMap(n=>shuffle(bank.filter(q=>q.lesson===n)).slice(0,10))):shuffle(bank.filter(q=>!scope||q.lesson===scope));if(!list.length)return;list=list.map(q=>({...q,order:shuffle(q.options.map((_,i)=>i))}));pos=0;answers=[];$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;render()}
function render(){cancelTimer();const q=list[pos];$('position').textContent=(pos+1)+' / '+list.length+'問'+(mode==='practice'?' ｜第'+q.lesson+'回':'');$('progress').max=list.length;$('progress').value=pos;$('question').textContent=q.question;$('question').classList.toggle('code-question',q.lesson===3&&/[;={}<>]|console\.log|querySelector/.test(q.question));$('choices').classList.remove('graded');$('choices').replaceChildren();q.order.forEach(i=>{const l=document.createElement('label');l.className='choice';const x=document.createElement('input');x.type='radio';x.name='choice';x.value=i;x.required=true;x.addEventListener('change',()=>{$('answer').requestSubmit()});const txt=document.createElement('span');txt.className='choice-text';txt.textContent=q.options[i];l.append(x,txt);$('choices').append(l)});$('submit').disabled=false;$('submit').hidden=true;$('feedback').textContent='';$('feedback').className='';$('explanation').hidden=true;$('explain').disabled=true;$('explain').setAttribute('aria-expanded','false');$('explain').textContent='解説';$('next').disabled=true;$('next').textContent='次の問題 →'; $('auto').disabled=mode==='exam';window.scrollTo(0,0)}
function detail(q,selected){const d=document.createElement('div');const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='✓ 正答：'+q.options[q.correct];const explanation=document.createElement('p');explanation.textContent=q.explanation||'';d.append(correct,explanation);if(Number.isInteger(selected)&&selected!==q.correct){const p=document.createElement('p');p.className='wrong-answer';p.textContent='✕ 選んだ回答：'+q.options[selected];d.append(p)}const a=document.createElement('a');a.href=source(q);if(q.textbookPage){a.dataset.lesson=q.lesson;a.dataset.page=q.textbookPage;a.href='./materials/lesson-0'+q.lesson+'.pdf#page='+q.textbookPage;}a.target='_blank';a.rel='noopener';a.addEventListener('click',cancelTimer);a.textContent=q.textbookPage?'さらに詳しく：第'+q.lesson+'回 教科書 P'+q.textbookPage:q.lesson>=3?'宿題PDF P'+q.page:'教科書を確認';d.append(a);return d}
$('answer').onsubmit=e=>{e.preventDefault();const value=new FormData(e.target).get('choice');const selected=Number(value);const q=list[pos];if($('submit').disabled||!q||value===null||!Number.isInteger(selected)||selected<0||selected>=q.options.length)return;answers.push({q,selected});$('submit').disabled=true;$('choices').querySelectorAll('input').forEach(x=>x.disabled=true);if(mode==='exam'){advance();return}const isCorrect=selected===q.correct;$('progress').value=pos+1;$('feedback').className=isCorrect?'good':'bad';$('feedback').textContent=isCorrect?'✓ 正解！':'✕ 不正解。 正答：'+q.options[q.correct];$('choices').classList.add('graded');$('explanation').replaceChildren(detail(q,selected));$('explain').disabled=false;$('next').disabled=false;$('choices').querySelectorAll('input').forEach(x=>{const i=Number(x.value),label=x.parentElement;if(i===q.correct||i===selected){const good=i===q.correct;label.classList.add(good?'good':'bad');const mark=document.createElement('span');mark.className='verdict';mark.textContent=good?(i===selected?'✓ 正解・選んだ回答':'✓ 正答'):'✕ 選んだ回答（不正解）';label.append(mark)}});$('next').textContent=pos===list.length-1?'結果を見る':'次の問題 →';if($('auto').checked){timer=setTimeout(advance,selected===q.correct?5000:8000)}};
function advance(){cancelTimer();if($('quiz').hidden||!$('submit').disabled)return;if(++pos<list.length){render();return}$('quiz').hidden=true;const correct=answers.filter(a=>a.selected===a.q.correct).length,pct=Math.round(correct/list.length*100);const r=$('result');r.replaceChildren();const h=document.createElement('h2');h.textContent='結果：'+correct+' / '+list.length+'問（'+pct+'点）';r.append(h);for(let n=1;n<=4;n++){const a=answers.filter(x=>x.q.lesson===n);if(a.length){const p=document.createElement('p');p.textContent='第'+n+'回：'+a.filter(x=>x.selected===x.q.correct).length+' / '+a.length+'問';r.append(p)}}const title=document.createElement('h3');title.textContent='間違えた問題の復習';r.append(title);const ul=document.createElement('ol');answers.filter(a=>a.selected!==a.q.correct).forEach(({q,selected})=>{const li=document.createElement('li');li.textContent=q.question+' ／ 回答：'+q.options[selected];li.append(detail(q,selected));ul.append(li)});r.append(ul);const wrong=answers.filter(a=>a.selected!==a.q.correct).map(a=>a.q);if(!wrong.length){title.textContent='全問正解！';ul.hidden=true}if(wrong.length){const retry=document.createElement('button');retry.className='primary';retry.textContent='間違えた問題だけ再挑戦（'+wrong.length+'問）';retry.onclick=()=>start('practice',wrong);r.append(retry,document.createTextNode(' '));}const b=document.createElement('button');b.textContent='学習メニューへ';b.onclick=()=>{r.hidden=true;$('setup').hidden=false};r.append(b);r.hidden=false;try{localStorage.setItem('web3_homework_last_result',JSON.stringify({mode,correct,total:list.length,date:new Date().toISOString()}))}catch(e){}}
$('practice').onclick=()=>start('practice');$('next').onclick=advance;$('explain').onclick=()=>{cancelTimer();$('explanation').hidden=!$('explanation').hidden;$('explain').setAttribute('aria-expanded',String(!$('explanation').hidden));$('explain').textContent=$('explanation').hidden?'解説':'解説を閉じる'};$('auto').onchange=()=>{cancelTimer();if($('auto').checked&&!$('next').disabled&&$('explanation').hidden){const a=answers[answers.length-1];timer=setTimeout(advance,a.selected===a.q.correct?5000:8000)}};$('leave').onclick=()=>{if(confirm('回答を中止しますか？')){cancelTimer();$('quiz').hidden=true;$('setup').hidden=false}};
</script></html>
