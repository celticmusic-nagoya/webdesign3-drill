<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教科書オリジナル問題集・実力テスト</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0f172a;color:#f1f5f9}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:20px}a{color:#93c5fd}button,select{font:inherit;background:#334155;color:inherit;border:1px solid #64748b;border-radius:10px;padding:12px;min-height:46px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #93c5fd}section{background:#1e293b;border:1px solid #475569;border-radius:16px;padding:20px;margin:16px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:bold;margin-bottom:12px}label.choice{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #64748b;border-radius:10px;margin:8px 0}input{width:20px;height:20px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary{background:#1d4ed8}.muted{color:#b5c4d8}button[disabled]{opacity:.5}h1{font-size:1.5rem}progress{width:100%}li{margin:12px 0}fieldset,legend,.choice{min-width:0;max-width:100%;overflow-wrap:anywhere}label.choice input{flex:0 0 20px}.code-question{font-family:ui-monospace,monospace;white-space:pre-wrap;line-height:1.7}#feedback{margin:16px 0;line-height:1.7}.correct-answer{color:#86efac;font-weight:700}.wrong-answer{color:#fca5a5;font-weight:700}@media(max-width:480px){main{padding:12px}section{padding:14px}.row button{flex:1 1 100%}} [hidden]{display:none!important}#quiz{padding-bottom:108px}#quiz .controls{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#1e293b;border-top:1px solid #64748b;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center}.controls button{padding:8px;font-size:14px;min-height:44px}.controls label{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:14px}#feedback{margin:8px 0;line-height:1.5}#explanation{margin:8px 0;overflow-wrap:anywhere}.choice.good{border-color:#86efac;background:#14532d}.choice.bad{border-color:#fca5a5;background:#7f1d1d}label.choice{padding:10px;margin:6px 0;overflow-wrap:anywhere}main:has(#quiz:not([hidden]))>h1,main:has(#quiz:not([hidden]))>p,main:has(#quiz:not([hidden]))>a{display:none} @media(max-width:480px){main{padding:6px}section{padding:12px;margin:4px 0}legend{margin-bottom:6px}}</style><main><a href="./index.html">← アプリのトップへ</a>　<a href="./textbook.html">教科書へ</a><h1>教科書オリジナル問題集・実力テスト</h1><p>第1〜4回の授業テキスト準拠。公式過去問ではありません。</p><section id="setup"><h2>学習モード</h2><div id="resume-panel" hidden><p id="resume-info" role="status"></p><div class="row"><button id="resume" class="primary">前回の続きから再開</button><button id="discard-session">途中の記録を削除</button></div></div><p id="session-status" role="status" class="muted"></p><label for="scope">出題範囲</label> <select id="scope"><option value="0">第1〜4回すべて</option><option value="1">第1回</option><option value="2">第2回</option><option value="3">第3回</option><option value="4">第4回</option></select><p class="muted" id="total"></p><div class="row"><button id="practice" class="primary">問題演習（全問）</button><button id="exam">実力テスト（40問）</button></div><p id="last" class="muted"></p><p class="muted">演習は回答ごとに解説。実力テストは各回10問、全回答後に採点します。</p></section><section id="quiz" hidden><div id="position" role="status"></div><progress id="progress"></progress><form id="answer"><fieldset><legend id="question"></legend><div id="choices"></div></fieldset><button class="primary" id="submit">回答する</button></form><div id="feedback" aria-live="polite" hidden></div><div id="explanation" hidden></div><div class="controls"><label><input id="auto" type="checkbox" checked> 自動で次へ（正解5秒・不正解8秒）</label><button id="explain" disabled>解説</button><button id="next" class="primary" disabled>次の問題 →</button><button id="leave">中断・保存</button></div></section><section id="result" hidden aria-live="polite"></section></main><script src="./materials/textbook-original.js"></script><script>
const $=id=>document.getElementById(id),bank=Array.isArray(window.TEXTBOOK_ORIGINAL)?window.TEXTBOOK_ORIGINAL:[];let list=[],pos=0,answers=[],mode='practice',timer=null;function cancelTimer(){clearTimeout(timer);timer=null}const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const source=q=>'./materials/lesson-0'+q.lesson+'.pdf#page='+q.page;
$('total').textContent='収録 '+bank.length+'問';function start(m,retry){cancelTimer();mode=m;const scope=Number($('scope').value);list=retry?shuffle(retry):m==='exam'?shuffle([1,2,3,4].flatMap(n=>shuffle(bank.filter(q=>q.lesson===n)).slice(0,10))):shuffle(bank.filter(q=>!scope||q.lesson===scope));if(!list.length)return;list=list.map(q=>({...q,order:shuffle(q.options.map((_,i)=>i))}));pos=0;answers=[];$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;render()}
function render(){cancelTimer();const q=list[pos];$('position').textContent=(pos+1)+' / '+list.length+'問'+(mode==='practice'?' ｜第'+q.lesson+'回':'');$('progress').max=list.length;$('progress').value=pos;$('question').textContent=q.question;$('question').classList.toggle('code-question',q.lesson>=3&&/[;={}<>]|console\.log|querySelector/.test(q.question));$('choices').replaceChildren();q.order.forEach(i=>{const l=document.createElement('label');l.className='choice';const x=document.createElement('input');x.type='radio';x.name='choice';x.value=i;x.required=true;x.addEventListener('change',()=>{if(mode==='practice')$('answer').requestSubmit()});const txt=document.createElement('span');txt.textContent=q.options[i];l.append(x,txt);$('choices').append(l)});$('submit').disabled=false;$('feedback').hidden=true;$('explanation').hidden=true;$('explain').disabled=true;$('explain').textContent='解説';$('next').disabled=true;$('submit').hidden=mode==='practice'; $('auto').disabled=mode==='exam';window.scrollTo(0,0);saveSession()}
function detail(q,selected){const d=document.createElement('div');const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='正答：'+q.options[q.correct];d.append(correct,document.createTextNode(q.explanation+' '));if(Number.isInteger(selected)&&selected!==q.correct){const p=document.createElement('p');p.textContent='選んだ回答：'+q.options[selected]+'。正答との違いを上の解説で確認しましょう。';d.append(p)}const a=document.createElement('a');a.dataset.lesson=q.lesson;a.dataset.page=q.page;a.href=source(q);a.addEventListener('click',cancelTimer);a.target='_blank';a.rel='noopener';a.textContent='さらに詳しく：第'+q.lesson+'回 教科書 P'+q.page;d.append(a);return d}
$('answer').onsubmit=e=>{e.preventDefault();const value=new FormData(e.target).get('choice'),selected=Number(value),q=list[pos];if($('submit').disabled||!q||value===null||!Number.isInteger(selected)||selected<0||selected>=q.options.length)return;answers.push({q,selected});saveSession();applyAnswer(selected,true);};
function applyAnswer(selected,autoAdvance){const q=list[pos];$('submit').disabled=true;$('choices').querySelectorAll('input').forEach(x=>x.disabled=true);if(mode==='exam'){advance();return}$('feedback').textContent=(selected===q.correct?'正解！':'不正解。')+' 正答：'+q.options[q.correct];$('feedback').hidden=false;$('explanation').replaceChildren(detail(q,selected));$('explain').disabled=false;$('next').disabled=false;$('choices').querySelectorAll('input').forEach(x=>{if(Number(x.value)===q.correct)x.parentElement.classList.add('good');else if(Number(x.value)===selected)x.parentElement.classList.add('bad')});$('next').textContent=pos===list.length-1?'結果を見る':'次の問題 →';if(autoAdvance&&$('auto').checked&&!document.hidden)timer=setTimeout(advance,selected===q.correct?5000:8000)}
function advance(){cancelTimer();if($('quiz').hidden||!$('submit').disabled)return;if(++pos<list.length){render();return}$('quiz').hidden=true;clearSession();const correct=answers.filter(a=>a.selected===a.q.correct).length,pct=Math.round(correct/list.length*100);const r=$('result');r.replaceChildren();const h=document.createElement('h2');h.textContent='結果：'+correct+' / '+list.length+'問（'+pct+'点）';r.append(h);for(let n=1;n<=4;n++){const a=answers.filter(x=>x.q.lesson===n);if(a.length){const p=document.createElement('p');p.textContent='第'+n+'回：'+a.filter(x=>x.selected===x.q.correct).length+' / '+a.length+'問';p.textContent+='（'+Math.round(a.filter(x=>x.selected===x.q.correct).length/a.length*100)+'%）';r.append(p)}}const title=document.createElement('h3');title.textContent='間違えた問題の復習';r.append(title);const ul=document.createElement('ol');answers.filter(a=>a.selected!==a.q.correct).forEach(({q,selected})=>{const li=document.createElement('li');li.textContent=q.question+' ／ 回答：'+q.options[selected];li.append(detail(q,selected));ul.append(li)});r.append(ul);const missed=answers.filter(a=>a.selected!==a.q.correct).map(a=>a.q);if(missed.length){const retry=document.createElement('button');retry.className='primary';retry.textContent='誤答だけ再演習（'+missed.length+'問）';retry.onclick=()=>start('practice',missed);r.append(retry)}else{const perfect=document.createElement('p');perfect.textContent='全問正解です。';r.append(perfect)}const b=document.createElement('button');b.textContent='学習メニューへ';b.onclick=()=>{r.hidden=true;$('setup').hidden=false};r.append(b);r.hidden=false;try{localStorage.setItem('web3_original_last_result',JSON.stringify({mode,correct,total:list.length,date:new Date().toISOString()}));showLast()}catch(e){}}
function showLast(){try{const a=JSON.parse(localStorage.getItem('web3_original_last_result'));$('last').textContent=a?'前回：'+a.correct+' / '+a.total+'問（'+Math.round(a.correct/a.total*100)+'%）':''}catch(e){}}showLast();$('practice').onclick=()=>start('practice');$('exam').onclick=()=>start('exam');$('next').onclick=advance;$('explain').onclick=()=>{cancelTimer();$('explanation').hidden=!$('explanation').hidden;$('explain').textContent=$('explanation').hidden?'解説':'解説を閉じる'};$('auto').onchange=()=>{cancelTimer();if($('auto').checked&&!$('next').disabled&&$('explanation').hidden){const a=answers[answers.length-1];timer=setTimeout(advance,a.selected===a.q.correct?5000:8000)}};$('leave').onclick=()=>{cancelTimer();saveSession();$('quiz').hidden=true;$('setup').hidden=false;refreshResume()};

const SESSION_KEY='web3_original_session_v1';
const bankById=new Map(bank.map(q=>[q.id,q]));
const signature=q=>JSON.stringify([q.question,q.options,q.correct]);
function readSession(){try{
 const v=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
 if(!v||v.version!==1||!['practice','exam'].includes(v.mode)||!Array.isArray(v.questions)||!v.questions.length||!Array.isArray(v.answers)||!Number.isInteger(v.pos)||v.pos<0||v.pos>=v.questions.length||![v.pos,v.pos+1].includes(v.answers.length))return null;
 if(v.mode==='exam'&&v.answers.length!==v.pos)return null;
 const ids=new Set();
 for(const x of v.questions){const q=bankById.get(x.id);if(!q||ids.has(x.id)||x.signature!==signature(q)||!Array.isArray(x.order)||x.order.length!==q.options.length||new Set(x.order).size!==q.options.length||x.order.some(i=>!Number.isInteger(i)||i<0||i>=q.options.length))return null;ids.add(x.id)}
 for(const [i,x] of v.answers.entries()){const q=bankById.get(v.questions[i].id);if(x.id!==q.id||!Number.isInteger(x.selected)||x.selected<0||x.selected>=q.options.length)return null}
 return v;
 }catch(e){return null}}
function saveSession(){if(!list.length||pos>=list.length)return false;try{localStorage.setItem(SESSION_KEY,JSON.stringify({version:1,mode,pos,scope:Number($('scope').value),auto:$('auto').checked,questions:list.map(q=>({id:q.id,signature:signature(q),order:q.order})),answers:answers.map(a=>({id:a.q.id,selected:a.selected})),updated:Date.now()}));return true}catch(e){$('session-status').textContent='途中経過を保存できません。ブラウザの保存設定を確認してください。';return false}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}refreshResume()}
function refreshResume(){const v=readSession();$('resume-panel').hidden=!v;$('resume-info').textContent=v?'保存済み：'+(v.mode==='exam'?'実力テスト':'問題演習')+' '+v.answers.length+' / '+v.questions.length+'問回答済み':''}
function resumeSession(){const v=readSession();if(!v){refreshResume();return}cancelTimer();mode=v.mode;pos=v.pos;list=v.questions.map(x=>({...bankById.get(x.id),order:x.order}));answers=v.answers.map((x,i)=>({q:list[i],selected:x.selected}));if([0,1,2,3,4].includes(v.scope))$('scope').value=String(v.scope);$('auto').checked=v.auto!==false;$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;render();if(answers.length===pos+1){const chosen=answers[pos].selected;$('choices').querySelectorAll('input').forEach(x=>{x.checked=Number(x.value)===chosen});applyAnswer(chosen,false)}}
$('resume').onclick=resumeSession;
$('discard-session').onclick=()=>{if(confirm('途中の学習記録のみ削除しますか？'))clearSession()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!$('quiz').hidden){cancelTimer();saveSession()}});
window.addEventListener('pagehide',()=>{if(!$('quiz').hidden){cancelTimer();saveSession()}});
$('auto').addEventListener('change',()=>{if(!$('quiz').hidden)saveSession()});
refreshResume();

</script></html>
