<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教科書オリジナル問題集・実力テスト</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0f172a;color:#f1f5f9}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:20px}a{color:#93c5fd}button,select{font:inherit;background:#334155;color:inherit;border:1px solid #64748b;border-radius:10px;padding:12px;min-height:46px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #93c5fd}section{background:#1e293b;border:1px solid #475569;border-radius:16px;padding:20px;margin:16px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:bold;margin-bottom:12px}label.choice{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #64748b;border-radius:10px;margin:8px 0}input{width:20px;height:20px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary{background:#1d4ed8}.muted{color:#b5c4d8}button[disabled]{opacity:.5}h1{font-size:1.5rem}progress{width:100%}li{margin:12px 0}fieldset,legend,.choice{min-width:0;max-width:100%;overflow-wrap:anywhere}label.choice input{flex:0 0 20px}.code-question{font-family:ui-monospace,monospace;white-space:pre-wrap;line-height:1.7}#feedback{margin:16px 0;line-height:1.7}.correct-answer{color:#86efac;font-weight:700}.wrong-answer{color:#fca5a5;font-weight:700}@media(max-width:480px){main{padding:12px}section{padding:14px}.row button{flex:1 1 100%}} </style><main><a href="./index.html">← アプリのトップへ</a>　<a href="./textbook.html">教科書へ</a><h1>教科書オリジナル問題集・実力テスト</h1><p>第1〜4回の授業テキスト準拠。公式過去問ではありません。</p><section id="setup"><h2>学習モード</h2><label for="scope">出題範囲</label> <select id="scope"><option value="0">第1〜4回すべて</option><option value="1">第1回</option><option value="2">第2回</option><option value="3">第3回</option><option value="4">第4回</option></select><p class="muted" id="total"></p><div class="row"><button id="practice" class="primary">問題演習（全問）</button><button id="exam">実力テスト（40問）</button></div><p id="last" class="muted"></p><p class="muted">演習は回答ごとに解説。実力テストは各回10問、全回答後に採点します。</p></section><section id="quiz" hidden><div id="position" role="status"></div><progress id="progress"></progress><form id="answer"><fieldset><legend id="question"></legend><div id="choices"></div></fieldset><button class="primary" id="submit">回答する</button></form><div id="feedback" aria-live="polite" hidden></div><div class="row"><button id="next" hidden>次の問題 →</button><button id="leave">中止して戻る</button></div></section><section id="result" hidden aria-live="polite"></section></main><script src="./materials/textbook-original.js"></script><script>
const $=id=>document.getElementById(id),bank=window.TEXTBOOK_ORIGINAL;let list=[],pos=0,answers=[],mode='practice';const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const source=q=>'./materials/lesson-0'+q.lesson+'.pdf#page='+q.page;
$('total').textContent='収録 '+bank.length+'問';function start(m,retry){mode=m;const scope=Number($('scope').value);list=retry?shuffle(retry):m==='exam'?shuffle([1,2,3,4].flatMap(n=>shuffle(bank.filter(q=>q.lesson===n)).slice(0,10))):shuffle(bank.filter(q=>!scope||q.lesson===scope));list=list.map(q=>({...q,order:shuffle(q.options.map((_,i)=>i))}));pos=0;answers=[];$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;render()}
function render(){const q=list[pos];$('position').textContent=(pos+1)+' / '+list.length+'問'+(mode==='practice'?' ｜第'+q.lesson+'回':'');$('progress').max=list.length;$('progress').value=pos;$('question').textContent=q.question;$('question').classList.toggle('code-question',q.lesson>=3&&/[;={}<>]|console\.log|querySelector/.test(q.question));$('choices').replaceChildren();q.order.forEach(i=>{const l=document.createElement('label');l.className='choice';const x=document.createElement('input');x.type='radio';x.name='choice';x.value=i;x.required=true;const txt=document.createElement('span');txt.textContent=q.options[i];l.append(x,txt);$('choices').append(l)});$('submit').disabled=false;$('feedback').hidden=true;$('next').hidden=true}
function detail(q){const d=document.createElement('div');const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='正答：'+q.options[q.correct];d.append(correct,document.createTextNode(q.explanation+' '));const a=document.createElement('a');a.href=source(q);a.target='_blank';a.rel='noopener';a.textContent='教科書 P'+q.page;d.append(a);return d}
$('answer').onsubmit=e=>{e.preventDefault();const selected=Number(new FormData(e.target).get('choice'));const q=list[pos];answers.push({q,selected});$('submit').disabled=true;$('choices').querySelectorAll('input').forEach(x=>x.disabled=true);if(mode==='exam'){advance();return}$('feedback').replaceChildren(document.createTextNode(selected===q.correct?'正解！':'不正解。'),detail(q));$('feedback').hidden=false;$('next').hidden=false;$('next').textContent=pos===list.length-1?'結果を見る':'次の問題 →'};
function advance(){if(++pos<list.length){render();return}$('quiz').hidden=true;const correct=answers.filter(a=>a.selected===a.q.correct).length,pct=Math.round(correct/list.length*100);const r=$('result');r.replaceChildren();const h=document.createElement('h2');h.textContent='結果：'+correct+' / '+list.length+'問（'+pct+'点）';r.append(h);for(let n=1;n<=4;n++){const a=answers.filter(x=>x.q.lesson===n);if(a.length){const p=document.createElement('p');p.textContent='第'+n+'回：'+a.filter(x=>x.selected===x.q.correct).length+' / '+a.length+'問';p.textContent+='（'+Math.round(a.filter(x=>x.selected===x.q.correct).length/a.length*100)+'%）';r.append(p)}}const title=document.createElement('h3');title.textContent='間違えた問題の復習';r.append(title);const ul=document.createElement('ol');answers.filter(a=>a.selected!==a.q.correct).forEach(({q,selected})=>{const li=document.createElement('li');li.textContent=q.question+' ／ 回答：'+q.options[selected];li.append(detail(q));ul.append(li)});r.append(ul);const missed=answers.filter(a=>a.selected!==a.q.correct).map(a=>a.q);if(missed.length){const retry=document.createElement('button');retry.className='primary';retry.textContent='誤答だけ再演習（'+missed.length+'問）';retry.onclick=()=>start('practice',missed);r.append(retry)}else{const perfect=document.createElement('p');perfect.textContent='全問正解です。';r.append(perfect)}const b=document.createElement('button');b.textContent='学習メニューへ';b.onclick=()=>{r.hidden=true;$('setup').hidden=false};r.append(b);r.hidden=false;try{localStorage.setItem('web3_original_last_result',JSON.stringify({mode,correct,total:list.length,date:new Date().toISOString()}));showLast()}catch(e){}}
function showLast(){try{const a=JSON.parse(localStorage.getItem('web3_original_last_result'));$('last').textContent=a?'前回：'+a.correct+' / '+a.total+'問（'+Math.round(a.correct/a.total*100)+'%）':''}catch(e){}}showLast();$('practice').onclick=()=>start('practice');$('exam').onclick=()=>start('exam');$('next').onclick=advance;$('leave').onclick=()=>{if(confirm('回答を中止しますか？')){$('quiz').hidden=true;$('setup').hidden=false}};
</script></html>
