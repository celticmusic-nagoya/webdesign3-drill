<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追加教材｜Webデザイン技能検定3級</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}a{color:#93c5fd}select{max-width:100%;padding:12px;font-size:16px}iframe{width:100%;height:75vh;border:1px solid #475569;background:white}p{line-height:1.6}*{box-sizing:border-box}button{font:inherit;color:#f8fafc;background:#334155;border:1px solid #64748b;border-radius:10px;padding:10px 14px;min-height:44px}button:disabled{opacity:.45}.swipe-help{background:#172554;color:#dbeafe;border:1px solid #475e96;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.9rem}.swipe-help summary{cursor:pointer;font-weight:700}.swipe-help p{margin:6px 0 0}.page-controls{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.page-controls span{font-variant-numeric:tabular-nums}#lecture-image{overflow:auto;background:#fff;border-radius:8px;overscroll-behavior-x:contain;touch-action:pan-y pinch-zoom}#lecture-image.is-zoomed{touch-action:pan-x pan-y pinch-zoom}#lecture-image img,#lecture-image canvas{display:block;height:auto;max-width:none}#lecture-reader[hidden],iframe[hidden],.swipe-help[hidden]{display:none!important}</style></head><body><main> <a href="./homework-drill.html" >穴埋め宿題を4択ドリルで解く →</a><p><a href="./textbook.html">← 教科書へ戻る</a></p><h1>第3・4回の教科書・補助教材</h1><p>講義テキスト・穴埋め教材・問題冊子・解答解説を原PDFのまま表示します。端末によってはPDFを別タブで開く必要があります。</p><label for="source">教材を選択</label> <select id="source"></select> <a id="open" target="_blank" rel="noopener">原PDFを開く</a><details class="swipe-help" id="swipe-help" open><summary>ページのめくり方・操作ガイド</summary><p>スマホ：画像を左へスワイプで次のページ、右へスワイプで前のページ。上下はスクロールできます。拡大中は横移動を優先します。</p><p>拡大中にページをめくる場合は100%に戻すか、前へ・次へボタンを使ってください。</p></details><p id="status" role="status"></p><section id="lecture-reader" hidden><div class="page-controls"><button id="prev">← 前へ</button><span id="progress" aria-live="polite"></span><button id="next">次へ →</button></div><div class="page-controls"><label for="page-select">ページ</label><select id="page-select"></select><button id="minus" aria-label="縮小">−</button><span id="zoom-label">100%</span><button id="plus" aria-label="拡大">＋</button><button id="fit">幅に合わせる</button></div><div id="lecture-image" aria-label="教科書原本のページ画像"></div></section><iframe id="viewer" title="教材PDF" loading="lazy"></iframe></main><script src="./reader-swipe.js"></script><script>
const books=[['第3回 講義テキスト','lesson-03.pdf'],['第4回 講義テキスト','lesson-04.pdf'],['第3回 自宅学習・穴埋め','homework-03.pdf'],['第4回 自宅学習・穴埋め','homework-04.pdf'],['第1〜4回 総合復習60問｜問題冊子','review-01-04-questions.pdf'],['第1〜4回 総合復習60問｜解答・解説','review-01-04-answers.pdf'],['第3・4回 総合復習60問｜問題冊子','review-03-04-questions.pdf'],['第3・4回 総合復習60問｜解答・解説','review-03-04-answers.pdf']];
const $=id=>document.getElementById(id),sel=$('source'),viewer=$('viewer'),open=$('open'),status=$('status'),reader=$('lecture-reader'),surface=$('lecture-image');let items=[],page=0,zoom=1,token=0,manifestPromise=null,pdfDoc=null,enginePromise=null,renderId=0;
books.forEach(([name],i)=>sel.add(new Option(name,i)));
function manifest(){if(!manifestPromise)manifestPromise=fetch('./materials/textbook-pages/manifest.json').then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).catch(e=>{manifestPromise=null;throw e});return manifestPromise}
function render(){if(!items.length)return;const i=Number(sel.value),current=items[page];$('progress').textContent=(page+1)+' / '+items.length;$('page-select').value=String(page);$('prev').disabled=page===0;$('next').disabled=page===items.length-1;open.href='./materials/'+books[i][1]+'#page='+(page+1);if(pdfDoc){renderCanvas(current);status.textContent=books[i][0]+'（原本PDF）';try{localStorage.setItem('web3_lecture_page_'+i,String(page))}catch(e){}return}const img=document.createElement('img');img.alt=books[i][0]+' '+(page+1)+'ページ';img.style.width=(zoom*100)+'%';img.width=current.width;img.height=current.height;img.onerror=()=>{if(surface.contains(img))status.textContent='ページ画像を取得できません。「原PDFを開く」で確認してください。'};img.src='./materials/textbook-pages/'+current.file;surface.replaceChildren(img);surface.scrollLeft=0;status.textContent=books[i][0]+'（原本レイアウト）';try{localStorage.setItem('web3_lecture_page_'+i,String(page))}catch(e){}}
function go(p){const next=Math.max(0,Math.min(items.length-1,p));if(next===page)return;page=next;render();window.scrollTo(0,0)}
function setZoom(v){zoom=Math.max(1,Math.min(2.5,v));surface.classList.toggle('is-zoomed',zoom>1);$('zoom-label').textContent=Math.round(zoom*100)+'%';$('minus').disabled=zoom===1;$('plus').disabled=zoom===2.5;const img=surface.querySelector('img,canvas');if(img)img.style.width=(zoom*100)+'%'}
async function pdfEngine(){if(window.pdfjsLib)return window.pdfjsLib;if(!enginePromise)enginePromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>window.pdfjsLib?resolve(window.pdfjsLib):reject(Error('PDF engine'));s.onerror=reject;document.head.append(s)}).catch(e=>{enginePromise=null;throw e});return enginePromise}
async function renderCanvas(){const id=++renderId,doc=pdfDoc,p=page;surface.replaceChildren();try{const pg=await doc.getPage(p+1),base=pg.getViewport({scale:1});if(id!==renderId)return;const scale=Math.min(3,Math.max(1,surface.clientWidth)/base.width*2.5),view=pg.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);canvas.style.width=(zoom*100)+'%';canvas.setAttribute('role','img');canvas.setAttribute('aria-label','教科書 '+(p+1)+'ページ');await pg.render({canvasContext:canvas.getContext('2d'),viewport:view}).promise;if(id!==renderId)return;canvas.style.width=(zoom*100)+'%';surface.replaceChildren(canvas);surface.scrollLeft=0}catch(e){if(id===renderId)status.textContent='PDFを描画できません。「原PDFを開く」で確認してください。'}}
async function show(){const i=Number(sel.value),[name,file]=books[i],url='./materials/'+file,current=++token;items=[];pdfDoc=null;renderId++;page=0;setZoom(1);surface.replaceChildren();reader.hidden=true;viewer.hidden=i<2;$('swipe-help').hidden=i>=2;open.href=url;status.textContent=name+'（PDF原本）';if(i>=2){viewer.src=url;return}viewer.removeAttribute('src');status.textContent='ページ画像を読み込み中…';try{try{const data=await manifest();if(current!==token)return;items=data[String(i+3)].pages;if(!Array.isArray(items)||!items.length)throw Error('no pages')}catch(e){const lib=await pdfEngine();if(current!==token)return;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await lib.getDocument({url,isEvalSupported:false}).promise;if(current!==token){doc.destroy();return}pdfDoc=doc;items=Array.from({length:doc.numPages},()=>({}));}try{const saved=Number(localStorage.getItem('web3_lecture_page_'+i));if(Number.isInteger(saved)&&saved>=0&&saved<items.length)page=saved}catch(e){}$('page-select').replaceChildren(...items.map((_,n)=>new Option('P'+(n+1),n)));reader.hidden=false;render()}catch(e){if(current!==token)return;status.textContent='ページ画像を読み込めません。原PDFで表示します。';viewer.hidden=false;viewer.src=url;$('swipe-help').hidden=true}}
$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('page-select').onchange=e=>go(Number(e.target.value));$('minus').onclick=()=>setZoom(zoom-.25);$('plus').onclick=()=>setZoom(zoom+.25);$('fit').onclick=()=>setZoom(1);
if(window.StudySwipe)StudySwipe.bind(surface,{previous:()=>go(page-1),next:()=>go(page+1),canTurn:()=>zoom===1});
sel.addEventListener('change',show);const params=new URLSearchParams(location.search),requested=Number(params.get('book'));if(params.has('book')&&Number.isInteger(requested)&&requested>=0&&requested<books.length)sel.value=String(requested);show();
</script></body></html>
