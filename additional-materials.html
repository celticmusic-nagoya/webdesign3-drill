<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追加教材｜Webデザイン技能検定3級</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:16px}a{color:#93c5fd}select{max-width:100%;padding:12px;font-size:16px}iframe{width:100%;height:75vh;border:1px solid #475569;background:white}p{line-height:1.6}</style></head><body><main> <a href="./homework-drill.html" >穴埋め宿題を4択ドリルで解く →</a><p><a href="./textbook.html">← 教科書へ戻る</a></p><h1>第3・4回の教科書・補助教材</h1><p>講義テキスト・穴埋め教材・問題冊子・解答解説を原PDFのまま表示します。端末によってはPDFを別タブで開く必要があります。</p><label for="source">教材を選択</label> <select id="source"></select> <a id="open" target="_blank" rel="noopener">原PDFを開く</a><p id="status" role="status"></p><iframe id="viewer" title="教材PDF" loading="lazy"></iframe></main><script>
const books=[['第3回 講義テキスト','lesson-03.pdf'],['第4回 講義テキスト','lesson-04.pdf'],['第3回 自宅学習・穴埋め','homework-03.pdf'],['第4回 自宅学習・穴埋め','homework-04.pdf'],['第1〜4回 総合復習60問｜問題冊子','review-01-04-questions.pdf'],['第1〜4回 総合復習60問｜解答・解説','review-01-04-answers.pdf'],['第3・4回 総合復習60問｜問題冊子','review-03-04-questions.pdf'],['第3・4回 総合復習60問｜解答・解説','review-03-04-answers.pdf']];
const sel=document.getElementById('source'),viewer=document.getElementById('viewer'),open=document.getElementById('open'),status=document.getElementById('status');books.forEach(([name],i)=>sel.add(new Option(name,i)));function show(){const [name,file]=books[Number(sel.value)];const url='./materials/'+file;open.href=url;viewer.src=url;status.textContent=name+'（PDF原本）'}sel.addEventListener('change',show);const requested=Number(new URLSearchParams(location.search).get('book'));if(new URLSearchParams(location.search).has('book')&&Number.isInteger(requested)&&requested>=0&&requested<books.length)sel.value=String(requested);show();
</script></body></html>
