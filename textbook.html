<script>
const BOOKS=[{"title":"第1回｜Webはどうやって届く？","source":"テキスト1回目.pdf","pages":[{"number":1,"title":"Webサイトが表示されるまで","text":"第1回      Web はどうやって届く？\n\nブラウザに URL を入力すると、Web サイトが表示される。      サイト見たい\n\nいつも何気なく行っているこの操作の裏側では、いくつもの仕組みが\n連携しています。まずは、「Web サイトが表示されるまで」を見てみよう。\n\n\n\n            Web サイトが表示されるまで\n\n           あなたのブラウザ\n           URL を入力してページを要求する\n\n\n\n\n   🌐       ① 相手の場所を調べる\n           DNS・ドメイン名・IP アドレス\n\n\n\n\n           ② サーバとやり取りする\n           HTTP・リクエスト・レスポンス\n                                  通信を安全にする仕組み\n                                    HTTPS・TLS\n           ③ サーバ側で必要な処理をする\n           PHP などのプログラム・データベース\n\n\n\n\n             サイトが表示される\n\n\n                          ※全体像を理解するための簡略図です。\n\n\n         Web サイトを届ける時に大切なこと\n安全に利用できるようにすること\n\n・悪意のある人に攻撃されたら？            ・悪いソフトが入り込んだら？\n・システムに弱点があったら？             ・大切な情報をどう守る？\nWeb の仕組みと、それを守る方法を知ることが大切です"},{"number":2,"title":"DNSとIPアドレス","text":"STEP1        Web サイトを見に行くには、まず「どのサーバにアクセスすればいいのか」\n              を知る必要があります。\n相手を探す         そこで登場するのが、ドメイン名・IP アドレス・DNS です。\n\n\n\n     友達の家に行きたい                                      サイトを見たい\n\n\n  A さんの家に行く                                                「example.jp」\n   名前はわかる                         名前だけじゃ                  ドメイン名はわかる\n                                   相手の家に\n       ↓                         辿り着けない！                           ↓\n    でも住所は？                                                  でも場所は？\n\n\n       ↓                      DNS は巨大な案内所\n                                                                   ↓\n    住所を調べる                                                DNS に問い合わせる\n                              DNS を使って、ドメイン名\n\n       ↓                                                           ↓\n                              に対応する IP アドレスを\n                              調べます。\n                                                             IP アドレス\n   今池 5 丁目 3-2                                                192.0.2.1\n\n\n       ↓                                                           ↓\n    家に行ける                                                WEB サーバーに行ける\n\n\n\n 試験の言葉にすると\nドメイン名：人が Web サイトなどを識別しやすくするための名前（例：example.jp）\nIP アドレス：ネットワーク上で通信相手を識別するために使われる番号。（例：192.0.2.1）\nDNS（Domain Name System）：ドメイン名と IP アドレスを対応付ける仕組み\n\n※覚えるポイント：DNS は IP アドレスそのものではなく、名前とアドレスを対応付ける仕組み\n\n\n                                                IPv4 と IPv6 の違い\nここは覚える\n                                     IPv4   32bit           IPv6   128bit\n   IP（Internet Protocol）とは？\n                                      192.168.1.10        2001:db8:0:0:0:0:0:1\nインターネットなどのネットワークで、データを                  ①   ② ③ ④           ①      ②   ③ ④⑤⑥ ⑦⑧\n宛先まで届けるための通信ルール（プロトコル）\n                                   IPv4 は 32bit の固定長      IPv6 は 128bit の固定長\nIP アドレスは、その通信で宛先や送信元を識別する          ドットで区切った 4 つの 10 進数    16 ビットずつの 8 つの区画を、\nために使われる番号                                                 コロン（:）で区切って表す\n                                                          ※連続する 0 などは、省略して表記できる\n\n\n                                     IPv6 は、IPv4 よりずっと多くのアドレスを扱える。"},{"number":3,"title":"サーバと通信の仕組み","text":"STEP2             DNS を使って、○○さんの家の場所がわかりました。\n相手と通信する            では、相手に用件を伝えて、返事をもらうにはどうすればいいのでしょう？\n\n\n\n                            用件を伝えて、返事をもらう\n\n\n       注文する                                               HTTP リクエスト\n                                                              （注文する）\n\n           ↓                                                    ↓\n    注文を受ける\n                                                         リクエストを受け取る\n\n           ↓                                                    ↓\n     返事をする                                                HTTP レスポンス\n                                                           （返事をする）\n\n           ↓                 HTTP は注文して返事をもらう\n                                                                ↓\n    注文が届く\n（返事を受け取る）                                               ページが表示される\n\n\n\n 試験の言葉にすると\nHTTP：ブラウザと Web サーバなどが情報をやり取りするための通信ルール\nリクエスト：ブラウザなどのクライアントからサーバへ送る要求\nレスポンス：サーバからクライアントへ返される応答。\n\n\n\nここは覚える                                         cookie（クッキー）\n\n             返事には番号がついている！                      Web サイトを利用するたびに、毎回\n HTTP のレスポンスには、処理結果を表すステータスコードがあります。           「はじめまして」では不便なことがあります。\n    コード                          意味            ・ログイン状態を保つ\n  200 OK                    リクエストが成功した         ・前回の表示設定を覚えておく\n  301 Moved Permanently     リソースが恒久的に移動した\n                                               ・カートの中身を保持する\n                                               など、Web サイトからの指示などによって\n  403 Forbidden             アクセスが拒否された\n                                               ブラウザに保存され、次回以降のアクセスで\n\n\n\n                                               ⚠\n  404 Not Found             要求されたリソースが見つからない   利用できる小さなデータ\n  500 Internal Server Error サーバ内部でエラーが発生した\n                                                   Cookie＝認証そのものを\n  503 Service Unavailable   サービスを一時的に利用できない\n                                                   行うわけではありません。"},{"number":4,"title":"HTTPのリクエストとレスポンス","text":"STEP3      ブラウザからのお願いを受け取った Web サーバ\n裏側の動き      でも、返事をするための情報は、どうやって用意するのでしょう？\n\n\n\n     サーバーの役割                               ブラウザからの\n                                           リクエストを受けて\n\n     🌐 →    リクエスト\n\n                      ←\n                      レスポンス                必要な処理を行い、\n                                           結果（Web ページ）を\n                                           返します。\n    ブラウザ\n               Web サーバー\n\n\n\n        PHP とは                             Web サーバー上で動く\n                                           プログラム言語の 1 つ\n入力された情報を処理する（ログイン・検索など）        リクエストに応じて\n条件に合わせてページの内容を変える（ユーザーごとの表示など） 動的な Web ページを\nデータベースと連携して、必要な情報を取得する         作ることができます。\n\n\n\n\n                              🗄\n    データベースとは                            Web サイトで使う\n                                        たくさんの情報を、\n保存されている情報の例\n                                        整理して保存しておく\n ・住所や連絡先などの一覧\n                                       「情報の倉庫」です。\n ・会員情報（ID やパスワードなど）\n ・商品の情報（名前、価格、在庫など）\n\n\n\n 全体の流れ\n\n\n\n リクエスト              処理する      情報を取り出す         レスポンス\n\n ブラウザから         PHP がリクエストの   データベースから        結果をブラウザに\n リクエストを送る       内容を処理する       必要な情報を取り出す      返す\n\n\n\n\nここは覚える\n ☑ Web サーバはリクエストを受け取り、レスポンスを返す\n ☑ PHP はサーバ側で処理を実行できるプログラミング言語\n ☑ データベースは情報を整理して保存・管理する\n ☑ PHP やデータベースを使わない Web ページもある"},{"number":5,"title":"HTTPとHTTPSの基本","text":"STEP4      HTTP を使ってブラウザと Web サーバが「お願い」と「返事」をやり取り\n            することを学びました。でも、そのやり取りを途中で誰かに見られたり、\n通信を守る\n            書き換えられたりしたら困ります。そこで登場するのが、HTTPS と TLS です。\n\n\n\n守られていない通信（HTTP)                     守られた通信（HTTPS）\n\n\n     🌐          ID:○○\n                password:12345\n                ( その他大事な情報）\n                                        🌐     ブラウザ\n\n\n   ブラウザ                                       ↓\n ふむふむ・・・\n 見える！見えるぞ！                    HTTPS は          暗号化された通信\n                                              （内容は読めない）\n     ↓                      会話に鍵をかける！\n                                              ↓\n          Web サーバー                            Web サーバー\n\n\n\n\nHTTP と HTTPS の比較                   サーバ証明書とは\n\n                                 安全な個室ブースに入っても、そこにいる受付担当\n            HTTP      HTTPS      者が偽物だったら困りますよね。\n                                 HTTPS では、サーバ証明書を利用して、通信相手の\n    通信        ○         ○\n                                 正当性を確認します。\n    保護       なし         ○\n                                 ブラウザは、証明書の有効性やアクセス先の名前\n   イメージ     誰でも  覗かれても\n                                 との一致などを確認します。\n           聞ける会話 聞けない会話\n                                 ただし証明書が正しくても、そのサイトの内容\n    URL     http://   https://   や運営者が信用できるという意味ではありません。\n\n\n\n  試験の言葉にすると\nHTTP：ブラウザと Web サーバなどが情報をやり取りするための通信ルール\nHTTPS：TLS を利用して HTTP の通信を保護する仕組み\nTLS：通信の暗号化や相手の認証、改ざん検知を支える仕組み\n\n\nここは覚える\n\n    ☑ HTTP は Web の通信ルール\n    ☑ HTTPS は TLS を利用して HTTP 通信を保護する\n    ☑ TLS は暗号化・認証・改ざん検知を支える\n    ☑ HTTPS だからといって、そのサイト自体が必ず安全とは限らない"},{"number":6,"title":"通信の仕組みを理解する①","text":"STEP5\n STEP5         Web サイトやシステムには、設計・実装・設定などに「弱点」が見つかることが\n               あります。でも弱点があるだけでは「攻撃」ではありません。\n通信を守る\n弱点を理解する        悪用されることで、被害につながることがあります。\n\n\n\n\n               家に例えるとこういう流れになります。\n①ヒビがある（脆弱性）        ②ヒビを見つける（攻撃者） ③ヒビを悪用する（攻撃）        ④被害が発生する\nCASE 1\n\n\n\n      🔍\n                            ヒビ\n                          見つけた！\n\n\n         ⚡\n         ⚡\n壁などのヒビや施錠に問題は      攻撃者が調べて、ヒビ（脆弱   見つけたヒビを利用して、侵入   盗み、荒らされるなど、問題が\nあるが、まだ何も起きていない     性）が見つかる         したり不正に利用する       起こる\n\n\n\n               ☑   「脆弱性」があるだけでは、攻撃されたこと\n                    にはならない！\n\n\n 試験の言葉にすると\n   脆弱性       システムやソフトウェアの設計・実装・設定などに存在する、セキュリティ上の弱点や欠陥\n\n   攻撃        脆弱性などを利用して、システムやネットワークに不正な操作を行う行為\n\n  Web 攻撃 Web アプリケーションの脆弱性を悪用して行う攻撃のこと\n  試験の言葉にすると\n   被害 攻撃によって生じる、情報漏えい・改ざん・サービス停止などの影響\n\n\n\n脆弱性と攻撃は別物！\n\n                     悪用される可能性がある。\n    ヒビ＝脆弱性\n                     修正することで、その弱点を悪用されるリスクを減らせる\n\n\n\n\n                                   🔒\n 攻撃＝ヒビを悪用すること        意図的に行われる悪用されたら被害に繋がる\n\n\n                                         ヒビを見つけたら、早めに\n                                         修正を行うことが必要！\n\n\n\n ここは覚える\n\n  ☑ 脆弱性＝セキュリティ上の弱点\n  ☑ 攻撃＝不正な操作や妨害などの行為\n  ☑ 被害＝情報漏えい・改ざん・サービス停止などの影響\n  ☑ 脆弱性が存在することと、攻撃されたことは別"},{"number":7,"title":"通信の仕組みを理解する②","text":"STEP5\n STEP6     システムやソフトウェアに存在するセキュリティ上の弱点を「脆弱性」と呼ぶこと\n           を学びました。\n通信を守る\nどう狙う？      では、攻撃者はどのような方法で、システムや利用者を狙うのでしょうか？\n\n\n\n             攻撃の手口は大きく分けると？\n\n ①システムの弱点を狙う        ②人の心理や行動を狙う               ③サービスを使えなくする\nプログラムの不具合などを悪用する    偽の案内や巧みな話術などで            大量の通信などで、正常な利用を妨げる\n                       情報を引き出す\n\n\n\n  代表的な攻撃\n\n      ゼロデイ攻撃\n 💥脆弱性が見つかった！                         「直す猶予がないうちに攻撃！」\n\n 通常なら、開発者が発見    →    🔧 修正    →     📦 修正プログラム提供\n こうした、修正プログラムが提供される前などの脆弱性を悪用する攻撃が、ゼロデイ攻撃\n\n OS コマンド・インジェクション\n                                             「OS への命令を注入」\n 👤 ユーザー → ⌨ 入力 →         正常な入力として処理される。\n                💀\n でも……悪意のある人が、 OS への不正な命令を入力などに紛れ込ませる\n サーバー側で実行されてしまう\n\n\n\n\n📞                   📧                           👀\n  ソーシャルエンジニアリング\n                                       「機械じゃなく、人を狙う！」\n\n     「システム担当です。          アカウント確認を                      他人が入力する\n      パスワードを             お願いします。                       パスワード\n      確認させてください」         sagidayo@sagi.com             をのぞき見る。\n\n     フィッシング攻撃                                DDoS 攻撃\n   だまして本人に入力させる                          大量に押しかける\n実在する企業などを装ったメールや偽サイトで、           多数の機器などから大量の通信や要求を送り、\nID・パスワードなどをだまし取る手口               サービスを正常に利用できなくさせる攻撃\n例 )：銀行を装ったメールから偽のログイン            例 )：受付に大量の人が一斉に押し寄せ、本来の\nページへ誘導する                         お客さんが利用できなくなる。\n\n\nここは覚える\n  ☑ ゼロデイ攻撃＝修正プログラムが提供される前などの脆弱性を悪用\n  ☑ OS コマンドインジェクション＝不正な OS コマンドを実行させる\n  ☑ ソーシャルエンジニアリング＝人の心理や行動の隙を利用する\n  ☑ フィッシング＝偽サイトなどで利用者をだます\n  ☑ DDoS＝大量の通信などでサービスを妨害する"},{"number":8,"title":"通信の仕組みを理解する③","text":"STEP5\n STEP7        システムの弱点を狙ったり、人をだましたりする攻撃の手口を学びました。\n通信を守る\nマルウェア         では、攻撃者が悪意のあるプログラムを使ったら、どんなことが起きるのでしょう？\n\n\n\n\n             マルウェア＝悪いソフトたちの大きな箱\n  ウイルス              ワーム       トロイの木馬          ランサムウェア         その他\n\n他のファイルなどに     自分自身で複製し、      一見すると正常・有        データなどを利用     情報を盗み取ったり、\n寄生して増殖する      ネットワークなどを      用なものに見せかけ        できない状態にして    不正な行為を行う\nイメージ          通じて広がる         て入り込み、不正な        復旧などと引き換え\n                             動作をする            に金銭を要求する\n\n     ↓               ↓              ↓              ↓           ↓\n              「自分でどんどん      「いい人のふりして        「人質にして、       「こっそり情報を\n「誰かにくっつく」\n               増える」          入ってくる」           お金を要求」        盗む」\n\n\n化学兵器テロ            偽札の大量生産    詐欺・なりすまし         誘拐・身代金要求\n\n普通の荷物に危険な     自分で偽札をどんどん     信用させて中に入り 人質に取り、\nものを仕込み、その     作り、あちこちに       込み、実は悪いこと 「返してほしければ\n荷物が開けられると     ばらまいて広げていく     をする        金を払え」と要求\n被害が広がる\n\n\n\n\n💡   それぞれが違う特徴で悪さをしますが、全部まとめて「マルウェア」の仲間です。\n\n\nSTEP5・6・7 を一度整理                         ウイルスとマルウェアの関係\n\n\n弱点はある？                      STEP5\n                                            マルウェア           ウイルス\n→「脆弱性」\n                                            ウイルス          悪意のあるソフトウエア\n                                                          の中の一種\n攻撃者（どうやって攻撃する？）                              ワーム\n                            STEP6\n→「攻撃手法」                                  トロイの木馬\n悪意あるソフトを使う？                              などなど、悪意のある\n                            STEP7        ソフトウエア全般\n\n\n\n\n                                        💡\n→「マルウェア」\n\n💡   攻撃・脆弱性・マルウェアは同じものではない！                  ウイルスはマルウェアの一種！\n\n\n\n\n ここは覚える\n    ☑ マルウェア＝悪意のあるソフトウェアの総称\n    ☑ ウイルス＝他のファイルなどに寄生して増殖する\n    ☑ ワーム＝自身を複製して広がる\n    ☑ トロイの木馬＝正常なソフトなどを装って不正な動作をする\n    ☑ ランサムウェア＝データなどを利用不能にして金銭を要求する"},{"number":9,"title":"認証とアクセス制御","text":"STEP8         攻撃や不正利用から情報を守るためには、利用者を確認し、操作できる範囲を管理\n守る仕組み①         することが重要です。\n\n\n\n\n               ①まずは建物の入り口から考えてみよう\n    入口           認証→OK              確認              認証と権限は別の役割！\n                                でも・・・\n       勝手に            こういう                      認証＝あなたは誰？\n                                中に入っても確認が必要\n     入らせません           者です。                      権限＝あなたは何をしていい？\n\n\n                                               🔒\n                               「この部屋に入っていい？」\n                                                    あなたの役割に応じて\n                               「この書類変更していい？」\n                                  ↓                 できること・できないことを\n                                権限を確認\nあなたは誰？         認証が OK になると                          決めています\n誰でも自由に入れるわけ    中に入れます。\nではありません。\n\n\n\n\n         ②Web に置き換えると                          ③認証には種類がある\n\n\n\n\n                                               🗣📱😀\n ログイン画面         本人であることを       その人に与えられた            認証に使われる 3 つの要素\n                   確認          権限でできることが\n                                                知識情報          所持情報        生体情報\n\n           🖱\n                                  決まる\n\n\n                           🖱\n    ログイン\n                     OK        サイトの閲覧    ○\n                                マイページ    ○\n                                         ×\n\n    💡\n                                 管理画面\n                                               本人だけが         本人が持っているもの   本人自身の特徴\n                                               知っているもの       例：スマートフォン、   例：指紋、顔など\n                                               例：パスワード、PIN   IC カードなど\n        ログインできた＝何でもできる、ではない！\n\n\n               ④多要素認証                            よく使われる多要素認証の例\n\n❌   多要素にならない              ✅   これが多要素認証！\n                                                ①パスワード ＋ スマホに届くコード\n                                               （知識情報と所持情報）\n\n パスワード ＋ PIN              パスワード ＋ スマートフォン       ②パスワード ＋ 指紋認証\n                                               （知識情報と生体情報）\n ※どちらも「知識情報」              ※知識情報 ＋ 所持情報\n\n                                                ②IC カード＋ PIN\n                                               （所持情報と知識情報）\n\n    💡   数じゃなくて「違う要素」を組み合わせる！"},{"number":10,"title":"不正アクセス禁止法","text":"⑤不正アクセスと不正アクセス禁止法\n不正アクセス行為： ネットワークを通じて、他人の識別符号を無断で入力したり、\n         アクセス制御機能による制限を不正に回避したりして、本来制限されて\n         る利用を可能にする行為\n\n不正アクセス禁止法： 不正アクセス行為や、それに関連する識別符号の不正取得・提供など\n         を禁止する法律\n\n\n\n\nここは覚える\n  ☑ 認証＝本人であることなどを確認する\n  ☑ 権限＝許可された操作やアクセスの範囲\n  ☑ 認証の 3 要素＝知識・所持・生体\n  ☑ 多要素認証＝異なる種類の認証要素を 2 つ以上組み合わせる\n  ☑ 最小権限の原則＝必要最小限のアクセス権限だけを付与する\n  ☑ 他人の ID・パスワードを無断で使ってログインする行為や、アクセス制御\n  機能による制限を不正に回避する行為などは、不正アクセス禁止法で禁止されている"},{"number":11,"title":"安全なWebサイトの運用","text":"STEP9    認証やアクセス制限を行っても、すべてのトラブルを防げるわけではありません。\n守る仕組み②    故障・操作ミス・攻撃などによって、大切なデータが失われることもあります。\n\n\n\n\n      ①まずは建物の入り口から考えてみよう\n ①バックアップ＝データの消失や破損に備えて保存するコピー\n\n         セーブしていなかったら……                     セーブしてあったら……\nゲームを進める                              ゲームを進める\n→ かなり進んだ！                            →   💾 セーブする\n                    また最初から……\n→ データが壊れる                            →さらに進める\n                                     →💥 データが壊れる\n                                     →💾 セーブ地点へ戻る\n\n\n\n\n                                                          📖\n②コピー 1 個作ったから安心？             ③3-2-1 ルールで安全性を高める\n\n\n\n\n                    📁 ☁\n                            1 ➕ 🗂➕🗂\n                                   大切なデータを守るための基本ルール\n 同じ PC の中にコピーしても、            データを 3 つ持つ\n PC そのものが壊れたら？                     コピー     コピー\n                                                 元データ ＋ コピー 2 つ\n\n\n\n                            2 ➕💽\n                                    ①       ②\n\n\n\n                             2 種類の異なる媒体に保存する\n                        ー                                     3 つ・2 種類\n\n\n\n\n⚠\n                     コピ                  PC ＋ 外付けストレージなど     1 つは別の場所\n\n   「コピーした」だけで安心しない。\n    どこに、いくつ保存しているかも大切。\n                            3💽\n                             1 つは別の場所に置く\n                                  クラウドストレージなど\n                                                              で災害や盗難\n                                                               に強くなる\n\n\n\n\n「戻れないバックアップでは意味がない」                         試験の言葉にすると\n    バックアップは取って終わりではありません！\n                                      バックアップ データの消失や破損などに備えて\n                                     （取っておく）複製を別に取っておくこと\n バックアップを取る    →     正しく保存できている？\n                                         リストア        バックアップしておいたデータ\n         必要なときに復元できる？                    （復元）        を使って、使える状態に戻す\n\n\n\n\n ここは覚える\n   ☑ バックアップ＝消失・破損に備えてデータの複製を保存する\n   ☑ リストア＝バックアップからデータを復元する\n   ☑ 3-2-1 ルール＝3 つのデータ、2 種類の媒体、1 つは別の場所\n   ☑ バックアップは復元できることの確認も重要"},{"number":12,"title":"Webサイト制作と公開","text":"HTML や CSS で Web サイトを作りました。\nSTEP10       でも、自分のパソコンにファイルがあるだけでは、一般の利用者がインターネット\nファイル転送       上からそのサイトを見られるとは限りません。\n             公開先のサーバにファイルを配置する方法の一つが、ファイル転送です。\n\n\n\n            ①まずはイメージしよう！＝宅配便で考える\n\n\n\n                 📄\n                   .html                   FTP＝File Transfer Protocol\n\n\n\n\n                                           📦\n                 .CSS など\n                                          ファイルを転送するための\n                                          プロトコル ( 通信のルール）です。\n             →              →                              FTP を使うと、サーバーへ\n                                                           ファイルを送ったり、\n 自分の PC                    Web サーバー                        受け取ったりすることが\n                                                           できます。\n\n\n\n\n         ②安全に送るには？                         3 つの違いをまとめよう\n\n       ファイル転送に使われるプロトコル。\nFTP                                                  FTP         FTPS        SFTP\n       📦 普通に荷物を送る\nFTPS\n       FTP に TLS による通信の保護を加えたもの。\n                                      安全な通信           ✖            〇           〇\n       📦🔒  FTP に鍵をかける\n                                       安全性を\n                                      支える仕組み\n                                                       ―         TLS          SSH\n       SSH を利用して安全にファイル転送を行う仕組み                                  21 番\nSFTP\n       🔐📦 SSH を使う別ルート                  ポート番号         21 番\n                                                  （制御接続）\n                                                               （一般的）\n                                                                 990 番\n                                                                              22 番\n                                                                            （一般的）\n  ⚠SFTP は「FTP の前に S を付けただけ」ではない                                （一般的）\n                                                                FTP に鍵を  SSH で送る\n                                         覚え方       普通に送る       かける（TLS） （別ルート）\n\nSTEP4 の TLS を思い出そう！                   ※FTPS は Explicit（明示的 TLS）と Implicit（暗黙的 TLS）の方式がある\n                                      ※実際には設定によって異なるポート番号も使用できます。\n根本の暗号化の仕組み（TLS）は同じ、守る対象が違う            また、FTP・FTPS ではデータ転送用に別の接続も使います。\n\n\n  Web のやりとり             ファイルのやりとり\n HTTP → HTTPS            FTP → FTPS\n\n\n            安全にする技術は TLS\n                                        FTP              FTPS              SFTP\n\n\n\n ここは覚える\n  ☑ FTP＝ファイルを転送するための通信ルール\n  ☑ FTPS＝FTP を TLS で保護する\n  ☑ SFTP＝SSH を利用したファイル転送方式\n  ☑ FTPS と SFTP は異なる仕組み"},{"number":13,"title":"公開・運用のまとめ","text":"STEP11\n            DNS、HTTP、HTTPS、FTP、IP など、さまざまな通信の仕組みが登場しました。\n通信の仕組みを     これらは、通信の中でそれぞれ異なる役割を担っています。\n  整理する\n\n\n        ①通信は 7 つの階に分かれている（OSI 参照モデル）\n  利用者\nアプリに近い\n                        🌐   利用するアプリケーションに     例）HTTP・FTP・DNS・メール\n\n\n                        📄\n                            近い通信サービスを扱う      （SMTP) など\n                            データの表現形式や文字コード   例）文字コード変換・データ形式変換\n\n\n                        👥\n                            暗号化などを扱う         暗号化など\n\n\n\n                        🚚\n                            通信する相手との接続やセッ    例）セッションの開始・終了・通信の\n                            ションを確立、維持、終了する   同期など\n                            相手までデータを届けるための\n\n\n                        🗺\n                                             例）TCP・UDP・ポート番号など\n                            通信を管理する\n                            どのネットワークへ届けるか    例）IP アドレス、ルーティングなど\n\n\n                        🤖\n                            経路を決めて転送する\n                            同じネットワーク内でのデータ   例）MAC アドレス・スイッチング\n\n\n                        📡\n                            転送を行う            など\n機器・信号\n に近い                        電気・光などの信号として実際   例）ケーブル・コネクタ・電気信号\n                            に伝える             光信号など\n\n\n\n      ②TCP と UDP の違い                   ③IP と MAC アドレスの違い\n\nTCP ちゃんと届いたか確認しながら送るイメージ       IP アドレス→ネットワーク上で通信相手を識別する\n・データが届いたか確認する（再送）              ための番号（3 階・ネットワーク層）\n・信頼性を重視した通信（サイト・メールなど）\n\nUDP 確認より速さを優先して送るイメージ          MAC アドレス→ネットワーク機器のインター\n・届いたか確認しない（再送しない）              フェースを識別するための番号\n・効率や速さを重視した通信（配信・ゲームなど）       （2 階・データリンク層）\n\n\n  覚え方のコツ（順番と語呂で覚える）\n  ア    アプリケーション         よく使う重要な用語をセットで！\n  プ    プレゼンテーション\n                         7 階 HTTP・FTP・DNS\n  セ    セッション\n                         4 階 TCP・UDP\n  ト    トランスポート\n  ネ    ネットワーク            3 階 IP アドレス\n\n  デ    データリンク            2 階 MAC アドレス\n\n  ブ    物理                1 階 ケーブル・信号\n\n\n\n ここは覚える\n        ☑ OSI 参照モデル＝通信の役割を 7 階層に分けた概念モデル\n        ☑ 第 7 層＝HTTP・FTP・DNS など\n        ☑ 第 4 層＝TCP・UDP\n        ☑ 第 3 層＝IP、第 2 層＝MAC アドレス\n        ☑ 第 1 層＝ケーブル・電気信号・光信号など"}]},{"title":"第2回｜そのWebサイト本当に公開して大丈夫？","source":"テキスト2回目.pdf","pages":[{"number":1,"title":"Webサイト公開前のチェック","text":"第2回 その Web サイト本当に公開して大丈夫？\nWeb サイトを作ってインターネット上に公開すると、見ることができるようになります。\nでも、「ちゃんと表示できた」だけで、Web サイトは完成でしょうか？\n公開する前には、「いろいろな人が使えるか？」、そして「法律やルールを守っているか？」\nという 2 つの視点から確認することが大切です。\nすべての人が情報やサービスを\n利用できるようになっている？\nネット上の\n画像や文章\n人に関する情報 不正な行為\nや攻撃\n見え方や聞こえ方が違う人、操作方法が違う人\n利用する機器や環境が違う人も使えるためには？\n勝手に使っていい？勝手に載せていい？\n何をしてもいいわけじゃない\n勝手に使っていい？勝手に載せていい？\n何をしてもいいわけじゃない\n法律やルールをチェック！\nCHECK 2. それ、やっていい？\nMY WEB SITE💕\n🗻⛰🏔\nCHECK 1. いろいろな人が使える？\nHTML も CSS もできた！\nサーバーに送った！\nブラウザにも表示された！\n表示できた\n＝完成ではない！"},{"number":2,"title":"アクセシビリティの基本","text":"STEP1 使える人を勝手に減らしてない？\nWeb サイトを利用する人は、みんな同じ環境・同じ方法で利用しているわけではありません。\n見え方や聞こえ方、操作方法などが違っても、必要な情報やサービスを利用できるように考える\nことが大切です。まずは、「Web アクセシビリティ」とは何かを見ていきましょう。\n作った自分が使えても、全ての人に使いやすいとは限らない\n↓\nWeb アクセシビリティとは？\n年齢や障害の有無、利用する機器や環境などにかかわらず、\nWeb の情報やサービスを利用できるようにすること\n高齢者・障害者等配慮設計指針\n情報通信における機器、ソフトウェア及びサービス\n第 3 部：ウェブコンテンツ\nWCAG（Web Content Accessibility Guidelines）\nWeb アクセシビリティについての国際的なガイドライン\nWCAG は、世界共通の Web アクセシビリティのガイドラインです。\n日本でも共通の基準を使えるように、WCAG 2.0 と同じ内容を日本産業規格に取り入れたものが、\nJIS X 8341-3:2016 です。\nつまり、別々のルールを覚えるのではなく、同じ考え方を国際的なガイドラインと日本の規格で\n扱っているということです。\nどちらも使える人を勝手に減らさないためのルールの話\n考え方・内容の対応関係\nCASE1: 画像だけで伝えた CASE2: CASE3:\n💭読めない 💭聞こえ\nない 💭マウスが\n使えない\n動画や音声だけで\n伝えた\nマウスでしか操作\nできない\n\b申し込みは\nこちら➡\n▶\n\t 申し込みは\nこちらをクリック\n�\n作った自分が使える＝「みんなが使える」ではない！\nみんなが使えないと情報が伝わらない・内容がわからない・先へ進めないことが起こる！\nJIS X 8341-3 とは？\nなぜ WCAG と JIS X 8341-3 があるの？\nWCAG との関係は？\n「使える人を勝手に減らさない」つまり、障害のある人や\n高齢者のための「特別なサイト」を作るのではなく、\n利用環境などにかかわらず、必要な情報やサービスを\n利用できるようにする考え方\n具体的にどうする？\n代替テキストで内容を伝える\n字幕・テキストでも情報を\n伝える (alt)\nキーボードでも操作できる\nようにする\n🏝\n🔊\n🖱\n画像だけ →\n音声だけ →\nマウスだけ →\n💡\n全部を丸暗記する必要はありません！まずは、これで OK WCAG\n（国際的なガイドライン）\nJIS X 8341-3\n（日本の産業規格） JIS X 8341-3\n＝Web コンテンツのアクセシビリティに関する\n日本産業規格"},{"number":3,"title":"知覚可能・操作可能","text":"STEP2 「見える？」と「使える？」は別の話\nWeb サイトには、文字・画像・動画・ボタンなど、いろいろな情報や機能があります。\nでも、「そこに情報があると分かること」と、「実際に操作して使えること」は別の話です。\nここでは、4 つの原則のうち、まず「知覚可能」と「操作可能」を具体的に見ていきます。\nまずは 2 つのケースで考えよう！\n知覚可能（Perceivable） 操作可能（Operable）\n🏖\n🔊\n🔴\n⌨\n⏰\n🚩\n画像→　代替テキスト（alt 属性）を用意する\n動画・音声→　字幕などでも情報を伝える\n色で区別→　色以外の情報も使う\n例）●必須　〇任意　など文字や形でもわかるように\nマウスでしか操作できない\n→ キーボードでも操作できるようにする\n時間制限が短すぎる\n→ 必要に応じて延長や停止ができるようにする\n今どこにいるのか分からない\n→ 見出し・リンクなどで移動しやすくする\n例）TOP ＞ サービス ＞ 申込（パンくずリスト）\n情報やユーザインタフェースの構成要素を、利用者が\n知覚できる方法で提示すること。\nユーザインタフェースやナビゲーションを、利用者が\n操作できるようにすること\nCASE1: ボタンが画像 CASE2: ボタンはわかる\n申し込みは\nこちら➡\n申し込みは\nこちら➡\n情報を知覚できない\n（受け取れない）\n「あること」は分かっても、何の\n情報なのかわからない人がいる\n操作できない（使えない）\n情報が分かっても、実際に使え\nなければ先へ進めない。\n問題文にこんな話が出たら まず考える 見分け方\n画像の代替テキスト\n字幕・テキストを用意する\n色だけに依存しない\nキーボードから操作できる\n操作の時間制限に配慮する\n現在位置が分かるようにする\n知覚可能\n情報を受け取れる？\n実際に使える？\n操作可能\n👁知覚可能\n⌨操作可能\n試験では「名前」だけで出る 📖 とは限らない！\n例）「画像に代替テキストを提供する」\n＝alt 属性の話\n＝画像を認識できない場合にも情報を受け取れ\nるようにしている（「知覚可能」の話！）\n💡丸暗記ではなく、「何ができる？」"},{"number":4,"title":"理解可能・堅ろう","text":"STEP3 「意味わかる？」と「ちゃんと伝わる？」\n知覚可能、操作可能を学びました。でも、情報を受け取れて操作もできても、内容や使い方が\n理解できなければ困ります。さらに、利用するブラウザや支援技術などが変わっても、情報が\n正しく伝わることも大切です。残りの 2 つ、「理解可能」と「堅ろう」を見ていきましょう。\nまずは 2 つのケースで考えよう！\n理解可能（Understandable） 堅ろう（Robust）\n📔\n🚫\n❌\n何を入力すればいいか分からない\n→ 項目名や入力方法を分かりやすく示す\nエラーの原因が分からない\n→ どこが間違っているか示す\n押したら予想外のことが起こる\n→ 操作したときに何が起こるか予測しやすくする\n情報やユーザインタフェースの操作を、利用者が理解\nできるようにすること。\nサイトをブラウザでなく、スクリーンリーダーなどの支援\n技術を使う人もいます。さまざまな環境でもコンテンツの\n情報や構造を正しく解釈できるようにすることが大切です。\n例えば、見た目だけでは、\n「大きくて太い文字だから見出し！」と人間には分かる。\nでも HTML では単なる文字だったら？\n支援技術には「見出し」と正しく伝わらないことがある。\n特定の環境に依存せず、正しくマークアップする\nCASE1: 入力したらエラー！ CASE2: 別のブラウザでは\n申込みフォーム\n送信\n申込みフォーム\n送信 ERROR\n操作自体はできた。\nでも、何を間違えたのか、どう\n直せばいいのか分からない。\n別の環境や支援技術で正しく解\n釈できない。\n環境が変わると正しく伝わらない\n問題文にこんな話が出たら まず考える 見分け方\n入力方法を分かりやすく示す\nエラーの場所・原因を示す\n操作結果を予測しやすくする\n支援技術でも解釈できる\n異なるユーザエージェントでも解釈できる\nHTML を適切に記述する\n理解可能\n人が分かる？\n機械・環境が\n変わっても\n伝わる？\n堅ろう\n👤\n📖 POUR 完成！\nP ＝ Perceivable（ 知覚可能）\n→「情報を受け取れる？」\nO ＝ Operable（ 操作可能）\n→「実際に使える？」\nU ＝ Understandable（ 理解可能）\n→「意味わかる？」\nR ＝ Robust（ 堅ろう）\n→「環境が変わっても伝わる？」"},{"number":5,"title":"WCAGの4原則","text":"STEP4 4 つの原則を 1 本につなごう！\nWeb アクセシビリティの 4 つの原則がそろいました。でも、「知覚可能・操作可能・理解可能\n堅ろう」という名前だけを覚えても、問題文の言い方が変わると迷ってしまいます。\nここでは 4 つを「Web サイトを使う流れ」としてつなげて、判断できるように整理しましょう。\nWeb サイトを使う流れで考えよう！\nSTEP1 STEP2 STEP3 STEP4\n申込みフォーム\nアドレスに\n＠がありません\n送信\n🏖 ERROR\n情報を受け取れる？\n（画像・文字・音声など）\nP｜Perceivable\n知覚可能\n実際に使える？\n（リンク・入力・移動など）\nO｜Operable\n操作可能\n意味がわかる？\n（内容・エラー・結果など）\nU｜Understandable\n理解可能\n環境が変わっても伝わる？\n（ブラウザ・支援技術など）\nR｜Robust\n堅ろう\n画像に何が書いてあるか\nわからない 例）代替テキスト・字幕\n色だけに依存しない\n例）キーボード操作・時間制限\nナビゲーション\n例）入力方法・エラー説明\n予測しやすい操作\n例）支援技術・ユーザエージェント\n適切な HTML\nボタンは分かるけど、\nキーボードで押せない\nエラーって出たけど、\n何を直すの？\n支援技術では、この部分を\n正しく解釈できない\n→\n→\n→\n→\n→\n→\n→\n→\n情報が受け取れない\n操作できない（使えない）\n意味・直し方が分からない\n環境が変わり正しく伝わらない\nP｜Perceivable（知覚可能）\nO｜Operable（操作可能）\nU｜Understandable（理解可能）\nR｜Robust（堅ろう）\n🔊 🎧\n読み上げソフト\n点字変換など\n届く 操作できる 意味がわかる 環境に依存しない\n迷ったら「何が困っている？」を見る！"},{"number":6,"title":"アクセシビリティ達成基準①","text":"STEP5 達成基準を詳しく見てみよう　\n実際に Web サイトを作るとき、どのようなことに気をつければよいのでしょうか？\nJIS X 8341-3 では、4 つの原則に基づいて、具体的な「達成基準」が定められています。\nここでは、改善前と改善後の Web サイトを比較しながら、代表的な達成基準を見ていきましょう\n① 知覚可能の達成基準"},{"number":7,"title":"アクセシビリティ達成基準②（図表中心）","text":"② 操作可能・理解可能・堅ろうの達成基準"},{"number":8,"title":"著作権と利用の基本","text":"STEP6 ネットにある＝使っていい？\nWeb サイトを作っていると、写真・イラスト・文章・音楽など、いろいろな素材を使いたく\nなります。でも、インターネットで見つけたもの＝自由に使っていいものではありません。\nまずは、Web 制作でも身近な著作権・知的財産から見ていきましょう。\nまずはこんな場面から！\n「知的財産」は著作権だけじゃない！\nCASE｜いい写真発見！\nそもそも「著作物」とは？\n写真 絵・工芸品 著作物を\n制作した人\n著作者に\n認めれる権利\n文章\n音楽 映像 プログラム\n📷 🖼 ' 🤓\n🎵\n📷 🎨 +\n🎵 🎥 🔤 💡\n☑\n🛠⚙ 🚘🛏 🎽\n🎥 🔤\nネットで見つけた\n＝ 自由に使える、ではない！\n著作物\n思想または感情を創作的に表現したもので、\n文芸・学術・美術・音楽の範囲に属するもの\n🌇 🌉 🌌\n💭 ⛺ 🌁 🌃\nこの写真いい！\nサイトで使おう\n🚨 著作者\n知的財産権\n著作権\n著作権（著作権法）\nWeb 制作ではどう考える？\n創作した表現などを守る 産業・ビジネスなどに使われるアイデアや特徴を守る権利\n発明を守る\nPOINT POINT\n写真・イラスト・文章\n音楽・映像・プログラムなど\n・著作物を創作した時点で、原則と\n　して自動的に発生\n・著作権には著作権（財産権）と\n著作者人格権がある\n・特許庁への出願・所定の手続きを経て登録される\n・作っただけでは権利は発生しない\n例）新しい技術 例）道具の工夫 例）製品のデザイン 例）ロゴ・マーク\n人が生み出したアイデアや創作物などを法律で守る権利の総称\nネットで見つけた画像・・・「検索で出てきたから使える？」\n素材サイトで見つけた画像・・・「フリー素材だから OK ？」\n他人が書いた文章・・・「少しならコピペしても？」\n誰が権利を持っている？\n利用条件はどうなっている？\n利用規約を確認！「無料」と、「何をしても自由」は違う\n使い方によっては著作権の問題になる\n考案を守る デザインを守る 商品・サービス\nの目印を守る\n特許権 実用新案権\n産業財産権\n意匠権 商標権\n🕉"},{"number":9,"title":"権利に関する確認事項","text":"思い出す言葉 ネットにある＝使っていいではない\n著作物の利用についての権利 著作者の人格的利益を守る権利\n（作者の精神的な思いや誇りを守る権利）\n・複製権（コピーする権利）\n・公衆送信権（Web 公開・ネット配信など）\n・譲渡権、貸与権（売ったり、レンタルする権利）\n・上演権・演奏権など\n・公表権（作品を、世に出すか決める権利）\n・氏名表示権（自分の名前を表示するか決める権利）\n・同一性保持権（勝手に改変されない権利）\n「引用」なら何でも OK ？\n🚨 出典を書けば OK というものではない！\n報道・批評・研究などの目的で、必要な範囲内で他人の著作物を自分の著作物に取り入れて利用すること\n法律関連用語は多いので、丸暗記したくなるけど、しない。\n「何を」守る法律なのかをしっかり思いだせるようにしておこう\n引用する必然性がある\n自分の文章と引用部分が明確に区別されている\n 自分の文章が主、引用部分が従という主従関係\n必要な範囲で引用する\n出所を明示する\n引用するにも条件があります。 ー引用の例ー\n山田太郎は、”●●は○○であるべきだ” と述べている。\nこれについての私自身の意見は・・・\n（出典：山田太郎「人生万歳」たいよう書房 2020 年）\n著作権と著作者人格権\n著作権（財産権） 著作者人格権\n重要！ 著作者人格権は譲渡できない！"},{"number":10,"title":"クリエイティブ・コモンズ","text":"STEP7 「使っていい」の条件を確認しよう！\nインターネット上には、一定の条件を守れば利用できる写真やイラストなどもあります。\nその利用条件を、誰にでも分かりやすく示す仕組みの一つが「CC ライセンス」です。\nここでは、CC ライセンスの種類と、それぞれの利用条件について見ていきましょう。\n著作権は、作った時点で自動発生＝無方式主義\nでは著作者が、「私の作品、こういう条件なら使っていいですよ」と意思表示したい場合は？\nBY（表示）: 著作者名など、指定されたクレジットを表示する\nNC（非営利）: 営利目的で利用しない\nND（改変禁止）: 改変した作品を共有しない\nSA（継承）: 改変した作品を共有する場合、同じライセンス条件を適用する\nCreative Commons License\n👩🎨\n著作者\n🖼\n作品\n「この条件なら利用 OK ！」 📋 （著作権を持ったまま、利用条件を意思表示する）\n試験の言葉にすると\nBY（表示）：著作者名などの表示が必要\nNC（非営利）：商用利用を認めない\nND（改変禁止）：改変した作品を共有できない\nSA（継承）：改変した作品にも同じライセンスを適用"}]}];
const el=id=>document.getElementById(id);let book=0,page=0,font=1;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readableParagraphs(text){return text.split(/\n\s*\n/).map(part=>part.replace(/\s+/g,' ').trim()).filter(Boolean)}
function formatPageText(text,term){return readableParagraphs(text).map(part=>{let html=safe(part);if(term){const needle=term.toLocaleLowerCase(),lower=part.toLocaleLowerCase();let cursor=0,at=-1;html='';while((at=lower.indexOf(needle,cursor))!==-1){html+=safe(part.slice(cursor,at))+'<mark>'+safe(part.slice(at,at+term.length))+'</mark>';cursor=at+term.length}html+=safe(part.slice(cursor))}return '<p>'+html+'</p>'}).join('')}
function render(){const b=BOOKS[book],p=b.pages[page];el('book').value=String(book);el('count').textContent='全'+b.pages.length+'ページ';el('page-label').textContent=b.source+' ・ '+(page+1)+' / '+b.pages.length;el('page-title').textContent=p.title;updatePdfLink();el('progress').textContent=(page+1)+' / '+b.pages.length;el('prev').disabled=book===0&&page===0;el('next').disabled=book===BOOKS.length-1&&page===b.pages.length-1;el('chapters').innerHTML=b.pages.map((x,i)=>'<button class="chapter" data-page="'+i+'" '+(i===page?'aria-current="page"':'')+'>'+safe('P'+(i+1)+' '+x.title)+'</button>').join('');el('chapters').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>go(book,Number(btn.dataset.page))));const term=el('search').value.trim();el('page-text').innerHTML=formatPageText(p.text,term);el('page-text').style.fontSize=font+'rem';try{localStorage.setItem('web3_textbook_position',JSON.stringify({book,page,font}))}catch(e){}}
const pdfPaths=['./materials/lesson-01.pdf','./materials/lesson-02.pdf'];const pdfAvailability=[false,false];async function checkPdf(i){if(location.protocol==='file:'){pdfAvailability[i]=true;updatePdfLink();return}try{const r=await fetch(pdfPaths[i],{method:'GET',headers:{Range:'bytes=0-4'},cache:'no-store'});if(!r.ok){pdfAvailability[i]=false}else{const bytes=new Uint8Array(await r.arrayBuffer());pdfAvailability[i]=bytes.length>=5&&bytes[0]===37&&bytes[1]===80&&bytes[2]===68&&bytes[3]===70&&bytes[4]===45}}catch(e){pdfAvailability[i]=false}updatePdfLink()}function updatePdfLink(){const a=el('original-pdf');a.hidden=!pdfAvailability[book];a.href=pdfPaths[book]+'#page='+(page+1);a.textContent='原PDFの'+(page+1)+'ページを開く';el('pdf-status').textContent=location.protocol==='file:'?'（同梱PDFを開きます）':pdfAvailability[book]?'（図表を含む原資料）':'（原PDFを確認できません）'}function go(b,p){book=b;page=p;render();window.scrollTo(0,0)}
function searchAll(){const term=el('global-search').value.trim();const out=el('search-results');if(!term){out.style.display='none';out.replaceChildren();return}const matches=[];BOOKS.forEach((b,bi)=>b.pages.forEach((p,pi)=>{const at=p.text.toLocaleLowerCase().indexOf(term.toLocaleLowerCase());if(at!==-1)matches.push({bi,pi,title:p.title,snippet:p.text.slice(Math.max(0,at-22),Math.min(p.text.length,at+term.length+45)).replace(/\s+/g,' ')})}));out.style.display='block';out.innerHTML='<strong>'+matches.length+'ページで見つかりました</strong>'+ (matches.length?'<div>'+matches.map((m,i)=>'<button class="chapter" data-result="'+i+'">'+safe('第'+(m.bi+1)+'回 P'+(m.pi+1)+'｜'+m.title+'：'+m.snippet)+'</button>').join('')+'</div>':'<p>該当するページはありません。</p>');out.querySelectorAll('[data-result]').forEach(btn=>btn.addEventListener('click',()=>{const m=matches[Number(btn.dataset.result)];go(m.bi,m.pi);el('search').value=term;render()}))}
el('global-search').addEventListener('input',searchAll);el('print').addEventListener('click',()=>window.print());
el('book').addEventListener('change',e=>go(Number(e.target.value),0));el('search').addEventListener('input',render);el('prev').addEventListener('click',()=>{if(page>0)go(book,page-1);else if(book>0)go(book-1,BOOKS[book-1].pages.length-1)});el('next').addEventListener('click',()=>{if(page+1<BOOKS[book].pages.length)go(book,page+1);else if(book+1<BOOKS.length)go(book+1,0)});el('zoomout').addEventListener('click',()=>{font=Math.max(.8,font-.1);render()});el('zoomin').addEventListener('click',()=>{font=Math.min(1.7,font+.1);render()});try{const v=JSON.parse(localStorage.getItem('web3_textbook_position')||'{}');if([0,1].includes(v.book)&&Number.isInteger(v.page)&&v.page>=0&&v.page<BOOKS[v.book].pages.length){book=v.book;page=v.page}if(v.font>=.8&&v.font<=1.7)font=v.font}catch(e){}render();checkPdf(0);checkPdf(1);
</script></body></html>
