name: Textbook static QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'textbook.html'
      - 'materials/SOURCE_MANIFEST.json'
      - 'tools/qa-textbook.cjs'
      - 'tools/build-offline.cjs'
      - 'tools/build-pwa.cjs'
      - '.github/workflows/offline-package.yml'
      - '.github/workflows/textbook-static-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  textbook-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check textbook and app source
        run: node tools/qa-textbook.cjs
      - name: Stage offline package
        run: node tools/build-offline.cjs
      - name: Compile offline Tailwind CSS
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/offline-input.css
          npm install --no-save --no-package-lock tailwindcss@3.4.17
          ./node_modules/.bin/tailwindcss -i /tmp/offline-input.css -o dist/webdesign3-offline/offline.css --content ./index.html --minify
          test -s dist/webdesign3-offline/offline.css
          node tools/build-offline.cjs --inline-css
      - name: Build installable PWA package
        run: node tools/build-pwa.cjs
      - name: Upload installable PWA package
        uses: actions/upload-artifact@v4
        with:
          name: webdesign3-pwa-https-deploy
          path: dist/webdesign3-pwa/
          retention-days: 14
          if-no-files-found: error
      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: webdesign3-offline-complete
          path: dist/webdesign3-offline/
          retention-days: 14
          if-no-files-found: error
      - name: Upload single-file Android offline app
        uses: actions/upload-artifact@v4
        with:
          name: webdesign3-offline-single-html
          path: dist/webdesign3-offline/index.html
          retention-days: 14
          if-no-files-found: error
