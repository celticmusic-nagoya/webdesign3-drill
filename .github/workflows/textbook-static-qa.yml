name: Textbook static QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'textbook.html'
      - 'materials/SOURCE_MANIFEST.json'
      - 'tools/qa-textbook.cjs'
      - '.github/workflows/textbook-static-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  textbook-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check textbook and app source
        run: node tools/qa-textbook.cjs
