name: Study drill QA
on:
  pull_request:
    paths:
      - 'homework-drill.html'
      - 'textbook-original.html'
      - 'materials/**'
      - 'tools/qa-study-drills.cjs'
  push:
    branches: [feature/textbook-original-exam-20261120]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/qa-study-drills.cjs
