name: Textbook browser QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'textbook.html'
      - 'tools/qa-textbook-browser.cjs'
      - 'tools/qa-offline-browser.cjs'
      - 'tools/build-offline.cjs'
      - '.github/workflows/textbook-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Install PDF rasterizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run browser integration checks
        run: node tools/qa-textbook-browser.cjs
      - name: Build and test offline single-file reader
        run: |
          node tools/build-offline.cjs
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/offline-input.css
          npm install --no-save --no-package-lock tailwindcss@3.4.17 playwright@1.58.2
          ./node_modules/.bin/tailwindcss -i /tmp/offline-input.css -o dist/webdesign3-offline/offline.css --content ./index.html --minify
          node tools/build-offline.cjs --inline-css
          node tools/qa-offline-browser.cjs
