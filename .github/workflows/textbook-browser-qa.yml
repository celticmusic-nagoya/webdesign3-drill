name: Textbook browser QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'textbook.html'
      - 'tools/qa-textbook-browser.cjs'
      - '.github/workflows/textbook-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run browser integration checks
        run: node tools/qa-textbook-browser.cjs
